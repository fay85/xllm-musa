syntax = "proto3";

package hccl_transfer.proto;
option cc_enable_arenas = true;
option cc_generic_services = true;

message Status {
  bool ok = 1;
}

message CommInfo {
  string addr = 1;
  bytes root_info = 2;
}

message BlockInfo {
  string addr = 1;
  uint32 mem_id = 2;
  repeated uint64 blocks = 3;
  repeated uint64 block_lengths = 4;
  repeated int64 layer_ids = 5;
}

service HcclTransferService {
  rpc InitComm(CommInfo) returns (Status) {}
  rpc RecvBlocks(BlockInfo) returns (Status) {}
  rpc SendBlocks(BlockInfo) returns (Status) {}
}