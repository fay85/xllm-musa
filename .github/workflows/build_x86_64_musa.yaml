name: xLLM Build x86_64 MUSA

# This persistent, privileged runner is limited to manual runs and main pushes.
# Maintainers can validate a reviewed branch with dispatch, while main pushes
# provide the post-merge hardware gate.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, xllm-musa-x86-cicd]
    timeout-minutes: 90
    steps:
      - name: Prepare submodule checkout
        run: |
          if [ -d .git/modules ]; then
            find .git/modules -type f -name '*.lock' -print -delete || true
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Clean submodules
        run: git submodule foreach --recursive git clean -ffdx

      - name: Build and smoke test
        env:
          MUSA_VISIBLE_DEVICES: '0'
        run: |
          chmod +x ./cibuild/build_musa.sh
          bash ./cibuild/build_musa.sh '
            python -m pip install pre-commit -i https://pypi.tuna.tsinghua.edu.cn/simple
            python setup.py bdist_wheel --device musa
            python -m pip install --force-reinstall --no-deps dist/*.whl
            python -c "import torch, torch_musa, xllm; \
              assert torch.musa.is_available(); \
              tensor = torch.ones(1, device=\"musa\"); \
              assert tensor.item() == 1.0; \
              assert xllm.Options is not None"
          '
