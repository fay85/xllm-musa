syntax = "proto3";

option go_package = "jd.com/jd-infer/xllm;xllm";
package xllm.proto;
option cc_generic_services = true;

import "common.proto";
import "tensor.proto";
import "multimodal.proto";

message ClusterInfos {
  repeated uint64 cluster_ids = 1;
  repeated uint32 ports = 3;
  int32 dp_size = 4;
  repeated string addrs = 5;
}

// request from prefill to decode.
// NOTE: maybe we should dispatch request to decod instance by xllm_service.
message DisaggRequests {
  // prefill instance name(ID)
  string prefill_name = 1;
  repeated DisaggRequest reqs = 2;
  ClusterInfos cluster_infos = 3;
}

message StopSequence {
  repeated int32 seq_tokens = 1;
}

message DisaggRequest {
  // req id
  string req_id = 1;
  // req id which is generated in xllm service
  string service_req_id = 2;
  // tokens num decide the blocks slots
  int64 tokens_num = 3;
  // request fields
  string prompt = 4;
  bool stream = 5;
  string x_request_id = 6;
  string x_request_time = 7;
  int32 max_tokens = 8;
  int32 max_context_len = 9;
  int32 seq_capacity = 10;
  bool ignore_eos = 11;
  int32 eos_token_id = 12;
  repeated int32 stop_token_ids = 13;
  repeated StopSequence stop_sequences = 14;
  int32 n = 15;
  int32 best_of = 16;
  float frequency_penalty = 17;
  float presence_penalty = 18;
  float repetition_penalty = 19;
  float temperature = 20;
  float top_p = 21;
  int64 top_k = 22;
  bool logprobs = 23;
  int64 top_logprobs = 24;
  bool is_embeddings = 25;
  bool echo = 26;
  bool skip_special_tokens = 27;
  repeated int32 prompt_tokens = 28;
  bool offline = 29;
  optional int32 ttlt_slo_ms = 30;
  optional Priority priority = 31;
  optional int32 ttft_slo_ms = 32;
  optional int32 tpot_slo_ms = 33;
  optional int32 tpot_priority_weight = 34;
  optional int32 ttft_priority_weight = 35;
  optional int32 ttlt_priority_weight = 36;
  optional int32 priority_weight = 37;
  string source_xservice_addr = 38;
  bool include_stop_str_in_output = 39;
  bool json_object = 40;
  bool json_reasoning_enabled = 41;
  // Identifies this reservation even when callers reuse a request ID.
  string reservation_id = 42;

  // Transfer output accounting only. Decode never counts forwarded input.
  // False from older senders disables request token accounting on Decode.
  bool request_token_accounting = 43;

  // G9: per-request grammar identity for the xgrammar backend. An empty
  // source (the default for older senders) means no xgrammar constraint;
  // the decode instance rebuilds the grammar from the source instead of
  // decoding the request unconstrained.
  int32 grammar_type = 44;  // GrammarSpec::Type (0 JSON_SCHEMA, 1 REGEX, 2 EBNF)
  string grammar_source = 45;
  bool grammar_strict = 46;

  // Tensor-free media identity and prompt-relative spans. Absence means text.
  optional MMDataEntry mm_data = 51;

}

// response for DisaggRequests from decode instance.
message DisaggResponses {
  repeated DisaggResponse resps = 1;
}

message DisaggResponse {
  reserved 3, 6, 21;

  // req id
  string req_id = 1;
  // http code
  int32 status_code = 2;
  int32 dp_rank = 4;

  reserved 5;
  reserved "xtensor_layer_offsets";
  // Group-aware block allocation. group_id is defined by the cache layout and
  // is opaque to the PD protocol.
  repeated KVTransferGroup groups = 20;
}

message KVTransferGroup {
  int32 group_id = 1;
  reserved 2;
  repeated uint64 ids = 3;
  // Number of leading blocks the D side already holds from its own prefix
  // cache. P advances its per-group transfer cursor to this value so it
  // starts pushing at the first block that D actually needs. Zero when D
  // has no shared prefix (e.g. DECODE-side SWA prefix cache is off by role).
  uint32 remote_shared_num = 4;
  reserved 5;  // was: repeated uint32 block_valid_token_counts
}

// Deprecated: Use DisaggGenerationsRequest instead
// TODO: support multi sequences in one request.
//       Now only consider one sequence case.
// TODO: support embedding, now we only support tokens.
// message DisaggGeneration {
//   // req id
//   string req_id = 1;
//   // token id
//   int64 token_id = 2;
//   bool has_logprob = 3;
//   float logprob = 4;
//   repeated int64 top_tokens = 5;
//   repeated float top_logprobs = 6;
//   string kv_cache_transfer_mode = 7;
//   repeated uint64 cluster_ids = 8;
//   repeated string addrs = 14;
//   repeated int32 block_ids = 11;
//   int32 dp_size = 12;
//   int32 dp_rank = 13;
// }

// Deprecated: Use DisaggGenerationsRequests instead
// First token from prefill instance to decode instance.
// message DisaggGenerations {
//   repeated DisaggGeneration gens = 1;
// }

message OutputUsage {
  // the number of tokens in the prompt.
  int32 num_prompt_tokens = 1;
  // the number of tokens in the generated completion.
  int32 num_generated_tokens = 2;
  // the total number of tokens used in the request (prompt + completion).
  int32 num_total_tokens = 3;
  // the number of prompt tokens served from prefix cache.
  int32 num_cached_tokens = 4;
}

message LogProbData {
  // the text of the token
  string token = 1;
  // the token id
  int32 token_id = 2;
  // the log probability of the token
  float logprob = 3;
  // whether the token is finished
  bool finished_token = 4;
}

message LogProb {
  LogProbData log_prob_data = 1;
  repeated LogProbData top_logprobs = 2;
}

message SequenceOutput {
  // the index of the sequence in the request.
  int32 index = 1;
  // the generated/delta text.
  // delta text is the text generated since the last response for streaming.
  string text = 2;
  // the token ids of the generated text.
  repeated int32 token_ids = 3;
  // the reason the sequence finished.
  string finish_reason = 4;
  // log probabilities of the generated tokens.
  repeated LogProb logprobs = 5;
}

message PublicError {
  int32 http_status_code = 1;
  string type = 2;
  string code = 3;
  string message = 4;
  optional string param = 5;
  bool retryable = 6;
}

message GenerationStatus {
  int32 status_code = 1;
  string status_msg = 2;
  // Legacy classification: keep fields 3/4 until readers without error retire.
  // Never reuse their field numbers after retirement.
  optional int32 failure_reason = 3;
  optional string param = 4;
  // Public business failure; not the status of the callback RPC.
  PublicError error = 5;
}

// Stream response token to prefill instance from decode.
message DisaggStreamGeneration {
  // req id
  string req_id = 1;
  // req id which is generated in xllm service.
  string service_req_id = 2;
  // the status of the request
  GenerationStatus gen_status = 3;
  // maybe multi sequences in the request
  repeated SequenceOutput outputs = 4;
  OutputUsage usage = 5;
  bool finished = 6;
  bool finished_on_prefill_instance = 7;
}

message DisaggStreamGenerations {
  repeated DisaggStreamGeneration gens = 1;
}

message StatusSet {
  repeated Status all_status = 1;
}

message RemoteToken {
  int64 token_id = 1;
  bool has_logprob = 2;
  float logprob = 3;
  repeated int64 top_tokens = 4;
  repeated float top_logprobs = 5;
  double time_to_first_token_latency_seconds = 6;
  // Metadata is emitted by P even when stop suppression withholds the text.
  // D must decode that text rather than infer delivery from token decoding.
  bool prefill_text_withheld = 7;
}

// Only stage durations cross hosts; no clock timestamps are transported.
message RequestPhaseTimingSample {
  optional double milliseconds = 1;
  bool valid = 2;
  bool partial = 3;
  uint32 reason = 4;
}

message RequestPhaseTiming {
  reserved 1;
  reserved "boundary_version";
  RequestPhaseTimingSample queued_time = 2;
  RequestPhaseTimingSample prefill_time = 3;
  RequestPhaseTimingSample decode_time = 4;
}

message DisaggGenerationsRequest {
  reserved 8, 13, 16;

  string req_id = 1;
  repeated RemoteToken tokens = 2;
  string kv_cache_transfer_mode = 3;
  repeated uint64 cluster_ids = 4;
  repeated string addrs = 5;
  int32 dp_size = 9;
  int32 dp_rank = 10;
  string x_request_id = 11;
  string x_request_time = 12;
  // MTP bootstrap state for the first decode draft extend.
  Tensor mtp_bootstrap_embedding = 14;
  // Number of prompt tokens served from the prefill prefix cache.
  int32 num_cached_tokens = 15;
  repeated KVTransferGroup source_groups = 20;
  // Cumulative end-to-end latency measured by the source at handoff.
  optional double upstream_elapsed_seconds = 21;
  RequestPhaseTiming phase_timing = 22;
  // Present only when the source has confirmed its output submission.
  // Unlike the first-token byte context, this proves Prefill's counted token.
  optional uint64 confirmed_upstream_output_tokens = 23;
  // Required for metadata-only VLM Decode; zero is a valid explicit delta.
  optional int32 mrope_position_delta = 25;
}

message DisaggGenerationsRequests {
  repeated DisaggGenerationsRequest multi_gens = 1;
}

message InstanceClusterInfo {
  string instance_name = 1;
  repeated uint64 cluster_ids = 2;
  repeated string addrs = 3;
  repeated uint32 ports = 5;
  int32 dp_size = 6;
  // Prefill-side effective KV-split width for link_cluster on decode.
  int32 kv_split_size = 7;
}

message ReleaseReservationRequest {
  string req_id = 1;
  string reservation_id = 2;
  // The PUSH transfer of this request ended without proof that the destination
  // buffers stopped being written. Decode must lease the waiting reservation's
  // target blocks instead of returning them to the pool.
  bool unsafe = 3;
}

message ReleaseReservationResponse {
  enum Result {
    UNKNOWN = 0;
    RELEASED = 1;
    NOT_WAITING = 2;
  }
  Result result = 1;
  // The request asked for a lease and Decode applied one. False when the
  // reservation was already gone.
  bool unsafe_leased = 2;
}

// Internal Service -> Decode control RPC, not an external API request.
// req_id is the engine ID reported by Prefill, not the client x-request-id.
message CancelRequestRequest {
  string req_id = 1;
  string service_req_id = 2;
  string source_xservice_addr = 3;
}

message CancelRequestResponse {
  enum Result {
    UNKNOWN = 0;
    // Queued for the scheduler; completion may win a concurrent cancellation.
    ACCEPTED = 1;
    NOT_FOUND = 2;
    // Decode still owns a reservation/restore. Retry after FirstGeneration.
    NOT_READY = 3;
    ALREADY_FINISHED = 4;
    INVALID_ARGUMENT = 5;
    NOT_SUPPORTED = 6;
  }
  Result result = 1;
}

service DisaggPDService {
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse) {}
  rpc ReleaseReservation(ReleaseReservationRequest)
      returns (ReleaseReservationResponse) {}
  rpc AddNewRequests(DisaggRequests) returns (DisaggResponses) {}
  rpc FirstGeneration(DisaggGenerationsRequests) returns (Status) {}
  rpc LinkInstance(InstanceClusterInfo) returns (Status) {}
  rpc UnlinkInstance(InstanceClusterInfo) returns (Status) {}
}
